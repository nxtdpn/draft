<html>
<head>
<title>Form</title>
</head>

<body>
    <div>
        <h1>Form in html</h1>
        <form>
            <table border="3">
            <tr>
                <td>Name:</td>
                <td><input type="text" name="name" placeholder="enter your name"></td>
            </tr>
            <tr>
                <td>Age:</td>
                <td><input type="number" name="age" placeholder="enter your age"></td>
            </tr>
            <tr>
                <td>Phone no:</td>
                <td><input type="number" name="phone no" placeholder="enter yiyr phone no"></td>
            </tr>
            <tr>
                <td>Hobby:</td>
                <td><input type="checkbox" name="hobby1" placeholder="enter your hobby">TALKING<br>
                    <input type="checkbox" name="hobby2"placeholder="enter your hobby">FOOTBALL<br>
                    <input type="checkbox" name ="hobby3" placeholdrr="enter your hobby">VIDEO GAMES <br>
                    </td>
            </tr>
            <tr>
                <td>Gender:</td>
                <td><input type="radio" name="gender" value="male">Male <br>
                    <input type="radio" name="gender" value="female">Female<br>
                </td>
            </tr>
            <tr>
            <td>Coutry</td>
            <td>   Select country:
                <select>
                    <option value="Switzerland"> Switzerland</option>
                    <option value="Germany"> Germany </option>
                    <option value="Nepal">Nepal</option>
                    <option value="Netherlands">Netherlands</option>
                </select>
                </td>
        </table>
        </form>
    </div>
</body>
</html>
